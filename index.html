<style>
/* Layout: app shell of glass HUD panels floating over a live aurora + grid backdrop. Rail on desktop, tab bar on phones. Deliberately single-theme: a night console. */
:root{
  color-scheme:dark;
  --bg:#060814; --surface:rgba(18,24,54,.62); --surface-solid:#0f1533; --surface-2:rgba(120,140,255,.10);
  --ink:#eef1ff; --muted:#8f97c4; --line:rgba(140,160,255,.16); --line-strong:rgba(140,160,255,.34);
  --cyan:#3ee6ff; --blue:#5b7cff; --violet:#9b5cff; --rose:#ff3d8b; --sun:#ffc24a; --mint:#2ef2b0;
  --on-accent:#ffffff; --good:#2ef2b0; --warn:#ffc24a; --bad:#ff5a83;
  --grad:linear-gradient(120deg,#3ee6ff,#5b7cff 38%,#9b5cff 68%,#ff3d8b);
  --shadow:0 24px 60px -30px rgba(0,0,0,.9);
  --f-display:"Unbounded","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:-10%;z-index:0;pointer-events:none;background:
  radial-gradient(45% 35% at 12% 0%,rgba(91,124,255,.30),transparent 70%),
  radial-gradient(40% 35% at 100% 15%,rgba(255,61,139,.20),transparent 70%),
  radial-gradient(50% 40% at 55% 105%,rgba(62,230,255,.16),transparent 70%);animation:aurora 22s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(140,160,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(140,160,255,.055) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 75%)}
@keyframes aurora{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-3%,2%,0) scale(1.08)}}
*{box-sizing:border-box}
::selection{background:rgba(62,230,255,.35);color:#fff}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(24px,3.6vw,34px);font-weight:700;background:linear-gradient(92deg,#ffffff,#c3cbff 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);opacity:.85}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.gradtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%;max-width:1260px;margin:0 auto}
.rail{position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(15,21,51,.55),rgba(6,8,20,.2));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 24px -4px rgba(91,124,255,.9)}
.logo-mark span{font-family:var(--f-display);font-weight:800;color:#fff;font-size:18px}
.logo b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;text-align:left;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.nav-btn svg{width:20px;height:20px;fill:currentColor;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:linear-gradient(90deg,rgba(91,124,255,.28),rgba(155,92,255,.06));color:#fff;box-shadow:inset 2px 0 0 var(--cyan)}
.nav-btn[aria-current="page"] svg{fill:var(--cyan);filter:drop-shadow(0 0 6px rgba(62,230,255,.7))}
.nav-btn .badge{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--rose);color:#fff;border-radius:99px;padding:1px 7px;box-shadow:0 0 12px rgba(255,61,139,.7)}
.rail-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px}
main{min-width:0;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:861px){main{padding-left:36px;padding-right:36px}}
.view{display:flex;flex-direction:column;gap:18px;max-width:980px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;font-family:var(--f-mono)}
.pill svg{width:16px;height:16px}
.pill.flame svg{fill:var(--rose);filter:drop-shadow(0 0 5px rgba(255,61,139,.8))} .pill.xp svg{fill:var(--sun);filter:drop-shadow(0 0 5px rgba(255,194,74,.8))}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,14,36,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
    padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar .nav-btn{flex-direction:column;gap:2px;font-size:10px;padding:6px 2px;flex:1;align-items:center;position:relative;min-width:0}
  .tabbar .nav-btn span:not(.badge){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tabbar .nav-btn[aria-current="page"]{background:none;box-shadow:none;color:var(--cyan)}
  .tabbar .nav-btn .badge{position:absolute;top:0;right:12%;margin:0}
}

/* generic */
.card{background:var(--surface);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(255,255,255,.03);padding:9px 16px;font-weight:700;transition:transform .12s ease,background .2s,box-shadow .2s,background-position .4s}
.btn:hover{background:var(--surface-2);box-shadow:0 0 0 1px rgba(62,230,255,.25),0 0 18px -6px rgba(62,230,255,.6)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.primary{background:var(--grad);background-size:180% 100%;border-color:transparent;color:#fff;box-shadow:0 8px 26px -10px rgba(91,124,255,.9)}
.btn.primary:hover{background:var(--grad);background-size:180% 100%;background-position:100% 0;box-shadow:0 8px 30px -8px rgba(155,92,255,.9)}
.btn.rose{background:linear-gradient(120deg,var(--rose),var(--violet));border-color:transparent;color:#fff;box-shadow:0 8px 26px -10px rgba(255,61,139,.9)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(255,255,255,.03);display:grid;place-items:center;flex:none;transition:box-shadow .2s,background .2s}
.iconbtn svg{width:20px;height:20px;fill:currentColor}
.iconbtn:hover{background:var(--surface-2);box-shadow:0 0 16px -6px rgba(62,230,255,.8)}
.iconbtn.rec,.mic-big.rec{background:var(--rose);border-color:var(--rose);color:#fff;animation:pulse 1.2s infinite}
.iconbtn.send{background:var(--grad);border:0;color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,61,139,.18),0 0 30px rgba(255,61,139,.6)}}
input[type=text],input[type=search],textarea,select{width:100%;border:1px solid var(--line-strong);background:rgba(4,6,18,.55);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(62,230,255,.15)}
select option{background:var(--surface-solid)}
input[type=range]{accent-color:var(--cyan)}
input[type=checkbox]{accent-color:var(--cyan);width:17px;height:17px}
textarea{resize:vertical;min-height:48px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:rgba(255,255,255,.03);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.chip:hover{border-color:var(--cyan)}
.chip[aria-pressed="true"]{background:linear-gradient(120deg,rgba(62,230,255,.22),rgba(155,92,255,.22));border-color:var(--cyan);color:#fff;box-shadow:0 0 14px -6px rgba(62,230,255,.9)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.reg{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:6px;white-space:nowrap;border:1px solid transparent}
.reg-familier{background:rgba(255,194,74,.14);color:#ffd88a;border-color:rgba(255,194,74,.3)}
.reg-argot{background:rgba(255,61,139,.14);color:#ff9cc3;border-color:rgba(255,61,139,.3)}
.reg-courant{background:rgba(62,230,255,.12);color:#9ff1ff;border-color:rgba(62,230,255,.28)}
.reg-soutenu{background:rgba(155,92,255,.16);color:#cdb3ff;border-color:rgba(155,92,255,.32)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--surface-solid);border:1px solid var(--line-strong);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;max-width:min(92vw,520px);box-shadow:0 0 30px -10px rgba(62,230,255,.6)}
@media (min-width:861px){.toast{bottom:28px}}
.banner{border-radius:14px;padding:12px 14px;background:rgba(255,194,74,.08);border:1px solid rgba(255,194,74,.32);font-size:14px}

/* avatar */
.av{display:inline-block;flex:none;position:relative}
.av svg{width:100%;height:100%;display:block}
.av .eyes{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
.av .mouth-open{opacity:0;transform-box:fill-box;transform-origin:center}
.av.talking .mouth-open{animation:talk .2s infinite alternate}
.av.talking .mouth-closed{opacity:0}
.av.thinking .pupils{transform:translate(2px,-3px)}
.av .pupils{transition:transform .3s}
.av .think{opacity:0;transition:opacity .2s}
.av.thinking .think{opacity:1}
.av.thinking .think circle{animation:dots 1s infinite}
.av.thinking .think circle:nth-child(2){animation-delay:.15s}
.av.thinking .think circle:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{from{opacity:1;transform:scaleY(.35)}to{opacity:1;transform:scaleY(1.15)}}
@keyframes dots{50%{transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{position:relative;width:148px;height:148px;display:grid;place-items:center;flex:none}
.halo::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#3ee6ff,#5b7cff,#9b5cff,#ff3d8b,#3ee6ff);animation:spin 7s linear infinite;
  -webkit-mask:radial-gradient(circle,transparent 63%,#000 64.5%,#000 67%,transparent 68%);mask:radial-gradient(circle,transparent 63%,#000 64.5%,#000 67%,transparent 68%);filter:drop-shadow(0 0 8px rgba(91,124,255,.9))}
.halo::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed rgba(62,230,255,.25);animation:spin 30s linear infinite reverse}
.halo .av{width:118px;height:118px}
.wave{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);display:flex;gap:3px;align-items:center;height:16px}
.wave i{display:block;width:3px;height:4px;border-radius:2px;background:var(--cyan);opacity:.5;transition:height .2s}
body.speaking .wave i{animation:eq .5s ease-in-out infinite alternate;opacity:1;box-shadow:0 0 6px var(--cyan)}
.wave i:nth-child(2){animation-delay:.1s!important}.wave i:nth-child(3){animation-delay:.25s!important}.wave i:nth-child(4){animation-delay:.05s!important}.wave i:nth-child(5){animation-delay:.3s!important}.wave i:nth-child(6){animation-delay:.15s!important}.wave i:nth-child(7){animation-delay:.2s!important}
@keyframes eq{from{height:3px}to{height:16px}}

/* home */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:26px 26px 30px;border-radius:26px;background:linear-gradient(135deg,rgba(26,34,84,.75),rgba(14,18,44,.55));border:1px solid var(--line-strong);position:relative;overflow:hidden;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hero::before{content:"";position:absolute;right:-80px;top:-100px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(155,92,255,.35),transparent 70%);pointer-events:none}
.speech{position:relative;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:14px 16px;font-size:16px;font-weight:500;max-width:60ch}
.hero-meta{display:flex;flex-direction:column;gap:14px;min-width:0;position:relative}
@media (max-width:560px){.hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:left}.hero-meta{width:100%}}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(255,61,139,.55))}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1}

const NOTES_PACK = {id:"notes-2026-10-26", title:"Your notes · 26 October",
 fixes:[
  ["J'espère je ne vous gêne pas","J'espère que je ne vous dérange pas","« Espérer » needs « que » before a new clause. « Gêner » also works; « déranger » is the usual choice here."],
  ["Je souhaite que je puisse","J'aimerais pouvoir… / Si seulement je pouvais…","With the same subject, French uses an infinitive, not « que » + subjunctive. Keep « je souhaite que » for a different subject: « je souhaite que tu réussisses »."],
  ["aient = « they would »","-raient = « they would » (ils feraient)","The conditional is future stem + -aient, so it ends in -raient. Plain -aient is also the imperfect: « ils faisaient » = they were doing / used to do."],
  ["réellement = actually","en fait / en réalité = actually","Faux ami: « réellement » means really or truly. « Actually » is « en fait » or « en réalité »."],
  ["ne soit pas inquiet","ne sois pas inquiet","Imperative of être with tu: « sois ». « Soit » is the subjunctive (« qu'il soit »)."],
  ["tu vas me manquer beaucoup","tu vas beaucoup me manquer","Short adverbs like beaucoup go before the infinitive."],
  ["je soulevé","j'ai soulevé","The passé composé needs its auxiliary: j'ai + soulevé."],
  ["Gens geniaux / meme si","des gens géniaux / même si","Accents matter, and the plural noun needs « des »."],
  ["dis-moi ce qui s'était passé","dis-moi ce qui s'est passé","The pluperfect (s'était passé) means « had happened », relative to another past moment. For a plain question, use the passé composé."],
  ["combien = how","combien = how much / how many","« Depuis combien de temps » works because it literally means « since how much time ». For « how (very) », use « à quel point »."],
  ["Tu m'as aidé à réaliser","Tu m'as aidé à prendre conscience de…","« Réaliser » for « realise » is common in speech, but « se rendre compte » or « prendre conscience » are safer in writing."]
 ],

function person(x,y,o={}){

  const al=L[(o.arms||[])[0]||"down"], ar=R[(o.arms||[])[1]||"down"];
  let g=`<g transform="translate(${x} ${y}) scale(${o.flip?-s:s} ${s})">`;

  }
  const by=o.sit?-50:-52;
  g+=`<path d="M-10 ${by+6} L10 ${by+6}" stroke="${top}" stroke-width="0"/>`;
  g+=`<line x1="-9" y1="${by+6}" x2="${al[0]}" y2="${al[1]+(o.sit?2:0)}" stroke="${top}" stroke-width="6" stroke-linecap="round"/>`;
  g+=`<line x1="9" y1="${by+6}" x2="${ar[0]}" y2="${ar[1]+(o.sit?2:0)}" stroke="${top}" stroke-width="6" stroke-linecap="round"/>`;
  g+=`<circle cx="${al[0]}" cy="${al[1]+(o.sit?2:0)}" r="3.2" fill="${sk}"/><circle cx="${ar[0]}" cy="${ar[1]+(o.sit?2:0)}" r="3.2" fill="${sk}"/>`;

  if(o.hairStyle==="bun") g+=`<circle cx="0" cy="${hy-12}" r="5" fill="${hair}"/><path d="M-9 ${hy-1} Q-9 ${hy-11} 0 ${hy-11} Q9 ${hy-11} 9 ${hy-1} Q5 ${hy-6} 0 ${hy-6} Q-5 ${hy-6} -9 ${hy-1}Z" fill="${hair}"/>`;
  if(o.hairStyle==="bald"){}
  if(o.cap) g+=`<path d="M-9 ${hy-3} Q0 ${hy-15} 9 ${hy-3}Z" fill="${o.cap}"/><rect x="2" y="${hy-5}" width="11" height="3" rx="1.5" fill="${o.cap}"/>`;
  g+=`<circle cx="3" cy="${hy}" r="1.2" fill="#1b1838"/><circle cx="-3" cy="${hy}" r="1.2" fill="#1b1838"/>`;

  if(o.item) g+=o.item;
  return g+"</g>";
}

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dkey = (d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${dd}`;};
const DAY=864e5;
const dayNum = ()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/DAY);
function toast(msg,ms=3200){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms);}
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const clone = o=>JSON.parse(JSON.stringify(o));
function merge(base,over){ if(!over||typeof over!=="object") return base; for(const k of Object.keys(over)){ const v=over[k]; if(v&&typeof v==="object"&&!Array.isArray(v)&&base[k]&&typeof base[k]==="object"&&!Array.isArray(base[k])) base[k]=merge(base[k],v); else base[k]=v; } return base; }
const use = n=> (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const norm = (s,acc=true)=>{ let t=String(s).toLowerCase().replace(/[’`]/g,"'").replace(/[«»"!?.,;:…()–—\/]/g," ").replace(/-/g," ").replace(/\s+/g," ").trim(); if(!acc) t=t.normalize("NFD").replace(/[̀-ͯ]/g,""); return t; };
function variants(fr){ let base=String(fr).replace(/…/g,"").replace(/\s*\+\s*inf\.?/,""); const parts=base.split(/\s+\/\s+/); const out=[]; for(const p of parts){ out.push(p.replace(/\(e\)/g,"")); out.push(p.replace(/\(e\)/g,"e")); } out.push(base.replace(/\(e\)/g,"")); return [...new Set(out.map(v=>v.trim()).filter(Boolean))]; }

const S = { main:defaultMain(), chat:{msgs:[],summary:"",sumTs:0,scenario:null}, cards:{} };
let loaded=false;

const Store = {
  mode:"local", db:null, uid:null, q:{}, timers:{},
  async init(){
    try{ const [db,user]=await Promise.all([use("db"),use("user")]);
      if(db&&user){ const id=await user.id(); if(id){ this.db=db; this.uid=id; this.mode="cloud"; } } }catch(e){}
  },
  base(){ return "data/users/"+this.uid; },
  mk(name){ return "tchm_"+this.uid+"_"+name; },
  async get(name){
    if(this.mode==="cloud"){ try{ const s=await this.db.doc(this.base()+"/"+name).get(); return s.exists?clone(s.data()):null; }catch(e){ console.warn(e); toast("Sync is temporarily unavailable: using your last save on this device."); return lsGet(this.mk(name)); } }
    return lsGet("tch_"+name);
  },
  _write(key,fn){ const prev=this.q[key]||Promise.resolve(); const p=prev.then(fn).catch(e=>{ console.warn(e); if(e&&e.code==="quota_exceeded") toast("Storage is full: delete a few phrases from your bank."); }); this.q[key]=p; return p; },
  save(name,getter,delay=700){
    clearTimeout(this.timers[name]);
    this.timers[name]=setTimeout(()=>{ const data=clone(getter());
      if(this.mode==="cloud"){ lsSet(this.mk(name),data); this._write(name,()=>this.db.doc(this.base()+"/"+name).set(data)); } else lsSet("tch_"+name,data); },delay);
  },
  cardsCol(){ return this.db.doc(this.base()+"/main").collection("cards"); },
  async cards(){
    if(this.mode==="cloud"){ try{ const snap=await this.cardsCol().limit(1000).get(); const o={}; snap.docs.forEach(d=>{ o[d.id]=clone(d.data()); }); return o; }catch(e){ console.warn(e); return lsGet(this.mk("cards"))||{}; } }
    return lsGet("tch_cards")||{};
  },
  saveCard(c){
    if(this.mode==="cloud"){ const data=clone(c); this._write("c_"+c.id,()=>this.cardsCol().doc(c.id).set(data)); clearTimeout(this.timers.cm); this.timers.cm=setTimeout(()=>lsSet(this.mk("cards"),S.cards),800); }
    else this.save("cards_local",()=>S.cards,500);
  },
  delCard(id){ if(this.mode==="cloud") this._write("c_"+id,()=>this.cardsCol().doc(id).delete()); else this.save("cards_local",()=>S.cards,300); }
};

const _origSave=Store.save.bind(Store);
Store.save=function(name,getter,delay){ if(name==="cards_local"){ clearTimeout(this.timers.cl); this.timers.cl=setTimeout(()=>lsSet("tch_cards",getter()),delay||500); return; } _origSave(name,getter,delay); };
const saveMain=()=>Store.save("main",()=>{ S.main.savedAt=Date.now(); return S.main; });

function dayLog(k=dkey()){ return S.main.log[k]||(S.main.log[k]={xp:0,reviews:0,correct:0,msgs:0,pics:0,newCards:0}); }
function addXP(n){ const l=dayLog(); l.xp+=n; renderPills(); }
function logAdd(f,n=1){ const l=dayLog(); l[f]=(l[f]||0)+n; }
function totalXP(){ return Object.values(S.main.log).reduce((a,l)=>a+(l.xp||0),0); }
function streak(){ let n=0; const d=new Date(); if(!((S.main.log[dkey(d)]||{}).xp>=20)) d.setDate(d.getDate()-1); while((S.main.log[dkey(d)]||{}).xp>=20){ n++; d.setDate(d.getDate()-1); } return n; }
function pal(){ return PALS[S.main.profile.penpal]||PALS.camille; }
function levelEst(){ const h=S.main.levelHist.slice(-12); if(!h.length) return S.main.profile.level; const c={}; h.forEach(l=>c[l]=(c[l]||0)+1); return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]; }
function userLevel(){ return Math.floor(Math.sqrt(totalXP()/120))+1; }

/* ---------------- cards ---------------- */
function seedCard(i){ const [fr,en,reg,ex,note]=SEED[i]; return {id:"s"+i,fr,en,reg,ex,note,src:"seed",added:Date.now(),due:0,ivl:0,ease:2.5,reps:0,lapses:0,last:0}; }
function hasFr(fr){ const n=norm(fr); return Object.values(S.cards).some(c=>norm(c.fr)===n); }
function addCard(o){ if(!o||!o.fr||hasFr(o.fr)) return null; const c={id:"c"+uid(),fr:String(o.fr).slice(0,240),en:String(o.en||"").slice(0,240),reg:o.reg||"courant",ex:String(o.ex||"").slice(0,300),note:String(o.note||"").slice(0,300),src:o.src||"gen",added:Date.now(),due:0,ivl:0,ease:2.5,reps:0,lapses:0,last:0}; S.cards[c.id]=c; Store.saveCard(c); return c; }
const isNew=c=>!c.last;
const isWeak=c=>c.last&&(c.lapses>=2||(c.hist||[]).slice(-3).includes(0));
const isMastered=c=>c.ivl>=21;
function dueCards(){ const now=Date.now(); return Object.values(S.cards).filter(c=>c.last&&c.due<=now); }
function newLeft(){ return Math.max(0,S.main.profile.newPerDay-(dayLog().newCards||0)); }
function newAvailable(){ return Object.values(S.cards).filter(isNew).length + (SEED.length-S.main.seedCursor); }
const prio=c=>c.src==="fix"||c.src==="notes"?0:c.src==="chat"?1:c.src==="gen"?2:3;
function newPool(n){
  const out=Object.values(S.cards).filter(isNew).sort((a,b)=>prio(a)-prio(b)||a.added-b.added).slice(0,n);
  while(out.length<n&&S.main.seedCursor<SEED.length){ const c=seedCard(S.main.seedCursor++); if(S.cards[c.id]||hasFr(c.fr)) continue; S.cards[c.id]=c; Store.saveCard(c); out.push(c); }
  saveMain(); return out;
}

async function svgToBlob(svg){ const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"})); try{ const img=new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; }); const c=document.createElement("canvas"); c.width=800; c.height=520; c.getContext("2d").drawImage(img,0,0,800,520); return await new Promise(r=>c.toBlob(r,"image/png")); } finally{ URL.revokeObjectURL(url); } }
async function evalPic(){
  const text=$("#picIn").value.trim(); if(!text){ toast("Describe the picture first (with the mic or typed)."); return; } if(!aiReady()) return offlinePic(text);
  const sc=pic.idx>=0?SCENES[pic.idx]:null; pic.busy=true; $("#evalBtn").disabled=true; $("#evalBtn").textContent="The examiner is marking…"; stopTimer();
  let images; try{ if(imgOK){ images=sc?[await svgToBlob(sc.draw())]:[pic.photo]; } }catch(e){ images=undefined; }
  if(!sc&&!images){ pic.busy=false; toast("Your photo couldn't be sent. Choose one of the pictures instead."); renderImages(); return; }
  const secs=pic.start?Math.round((Date.now()-pic.start)/1000):null;
  try{
    const r=await ai("json",`You are an experienced, demanding but encouraging French oral examiner (DELF/DALF and A-level speaking style). A ${levelEst()} learner answered this task about ${images?"the attached image":"an image"}.
Task: "${pic.question}"
${sc?`What the image shows (ground truth): ${sc.key}`:"Use only what you can see in the attached photo."}
Their answer (may come from speech dictation: ignore capitalisation and missing punctuation): """${text.slice(0,4000)}"""
${secs?`Time taken: ${secs} s.`:""}
Mark it. Score each criterion 0-5: contenu (relevance, coverage of the picture, ideas, hypotheses), grammaire (accuracy and range of structures), vocabulaire (precision, range, idiomatic language), aisance (coherence, connectors, natural spoken flow).
Reply with ONLY JSON:
{"criteria":{"contenu":0,"grammaire":0,"vocabulaire":0,"aisance":0},"verdict_en":"3 specific sentences of feedback in English: one strength, the main weakness, the one thing to do next time","corrected":"their answer with every error fixed but their ideas and style kept","corrections":[{"wrong":"","right":"","why":"short English","type":"gender|agreement|tense|mood|preposition|word-choice|spelling|register|syntax|other"}],"model":"a model answer one level above theirs, 100-150 words, natural spoken French, using a range of structures (relative clauses, hypotheses with « on dirait que / il semblerait que / j'imagine que », subjunctive where natural, connectors like « au premier plan », « à l'arrière-plan », « d'ailleurs »)","missed":["important details they didn't mention, in French"],"phrases":[{"fr":"","en":"","reg":"courant","ex":""}],"followups":["3 examiner follow-up questions in French on the picture's broader theme, as in a real oral exam"]}
All French you write must be flawless.`,{images,cache:false,modelTier:"default"});
    const cr=r.criteria||{}; const score=["contenu","grammaire","vocabulaire","aisance"].reduce((a,k)=>a+Math.max(0,Math.min(5,+cr[k]||0)),0);
    r.score=score; pic.res=r;
    (r.corrections||[]).forEach(c=>{ if(!c||!c.right) return; const t=ERR_LABELS[c.type]?c.type:"other"; S.main.errors[t]=(S.main.errors[t]||0)+1; if(c.wrong&&String(c.wrong).length<140) addCard({fr:c.right,en:`Corrige : « ${c.wrong} »`,note:c.why,src:"fix"}); });
    S.main.pics.push({title:sc?sc.title:"My photo",score,ts:Date.now()}); S.main.pics=S.main.pics.slice(-60);
    logAdd("pics"); addXP(40+score*2); saveMain();
  }catch(e){ aiErr(e); }

}

const DRILLS=[
 {t:"U / OU",tip:"For « u » [y], say « i » then push your lips forward into a round shape without moving your tongue. « ou » [u] is made further back in the mouth, like English 'oo'.",items:["dessus, dessous","la rue, la roue","tu, tout","Tu as vu la roue dans la rue ?","Vous avez vu tout ce qu'il a voulu ?"]},
 {t:"Nasal vowels",tip:"[ɑ̃] « an / en », [ɔ̃] « on », [ɛ̃] « in / un ». Air goes through your nose and the n itself is not pronounced.",items:["le vent, le vin, ils vont","lent, lin, long","blanc, blond","Un bon vin blanc.","Mon enfant a trente ans."]},
 {t:"The French R",tip:"The R is made at the back of the throat, like a soft gargle, with the tip of your tongue resting behind your bottom teeth.",items:["rue, roue, rare","très, prendre, partir","Le rat rentre rapidement par la porte arrière.","Je rentre de Paris en train."]},
 {t:"E, É, È",tip:"« le » [lə]: relaxed, slightly rounded lips. « les » [le]: a tight smile. « lait » [lɛ]: mouth more open.",items:["le, les, lait","je, j'ai","J'ai fait le café et les crêpes."]},
 {t:"Liaisons",tip:"A final s links to the next vowel with a [z] sound: « les‿amis ». « Ils‿ont » [z] (they have) and « ils sont » [s] (they are) mean different things.",items:["les amis, vous avez","ils ont, ils sont","Ils ont des amis anglais.","Nous en avons vraiment assez."]},
 {t:"GN, ILL & traps",tip:"« gn » [ɲ] as in 'canyon', « ill » [j] as in 'yes'. Traps: ville, mille and tranquille are said with a real [l].",items:["montagne, gagner, Espagne","famille, travailler, fille","ville, mille, tranquille","Ma famille habite à la montagne, c'est tranquille."]},
 {t:"Spoken French",tip:"In speech, French people swallow sounds: « je ne sais pas » becomes « chais pas », « il y a » becomes « y a », « tu es » becomes « t'es ».",items:["Je ne sais pas.","Il y a un problème.","Tu es où ?","Qu'est-ce que tu fais ce soir ?"]}
];
const VIRE=["Les chaussettes de l'archiduchesse sont-elles sèches ou archisèches ?","Un chasseur sachant chasser doit savoir chasser sans son chien.","Ton thé t'a-t-il ôté ta toux ?","Je veux et j'exige d'exquises excuses.","Trois tortues trottaient sur un trottoir très étroit.","Natacha n'attacha pas son chat Pacha qui s'échappa.","Cinq chiens chassent six chats.","Si six scies scient six cyprès, six cent six scies scient six cent six cyprès."];
let oral={mode:"mine",drill:0,i:0,free:"",heard:"",res:null,ipa:"",tips:null};
function oralTargets(){
  if(oral.mode==="sons") return DRILLS[oral.drill].items;
  if(oral.mode==="vire") return VIRE;
  if(oral.mode==="libre") return [oral.free||"Je prends mon apprentissage du français au sérieux."];
  const cs=Object.values(S.cards).filter(c=>(c.last||c.src==="notes")&&!c.fr.includes("…")).sort((a,b)=>(isWeak(b)-isWeak(a))||((b.last||b.added)-(a.last||a.added))).slice(0,40).map(c=>c.fr.replace(/\(e\)/g,"").trim());
  return cs.length?cs:SEED.slice(0,25).filter(s=>!s[0].includes("…")).map(s=>s[0].replace(/\(e\)/g,""));
}
const NUMW=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
function n2w(n){ if(n<17) return NUMW[n]; if(n<20) return "dix "+NUMW[n-10]; const T={20:"vingt",30:"trente",40:"quarante",50:"cinquante",60:"soixante"};
  if(n<70){ const t=Math.floor(n/10)*10,u=n%10; return T[t]+(u===1?" et un":u?" "+NUMW[u]:""); } if(n<80) return "soixante "+(n===71?"et onze":n2w(n-60));
  if(n<100) return "quatre vingt"+(n===80?"s":" "+n2w(n-80)); if(n<1000){ const h=Math.floor(n/100),r=n%100; return (h>1?NUMW[h]+" cent":"cent")+(r?" "+n2w(r):""); } return String(n); }
function phon(w){ let s=w.toLowerCase().replace(/ç/g,"s").replace(/œ/g,"e").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
  s=s.replace(/ph/g,"f").replace(/qu/g,"k").replace(/c(?=[aou])/g,"k").replace(/c(?=[eiy])/g,"s").replace(/h/g,"").replace(/eau|au/g,"o").replace(/ai|ei/g,"e").replace(/y/g,"i").replace(/(.)\1+/g,"$1");
  s=s.replace(/(ent|es|e|s|t|x|d|z)$/,""); return s||w.toLowerCase(); }
const ptoks=t=>norm(String(t).replace(/\d+/g,d=>" "+n2w(+d)+" ")).split(" ").filter(Boolean);
const same=(a,b)=>a===b||(a.length>=5&&b.length>=5&&lev(a,b)<=1);
function analyzePron(target,heard){
  const words=target.split(/\s+/).filter(Boolean); const T=[];
  words.forEach((w,wi)=>ptoks(w).forEach(k=>T.push({k:phon(k),wi})));
  const H=ptoks(heard).map(phon); const n=T.length,m=H.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=same(T[i].k,H[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(same(T[i].k,H[j])){ ok[i]=true; i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  const status=words.map((w,wi)=>{ const idx=T.map((t,k)=>t.wi===wi?k:-1).filter(k=>k>=0); return idx.length?(idx.every(k=>ok[k])?"ok":"miss"):"na"; });
  const sc=status.filter(x=>x!=="na"); const score=sc.length?Math.round(sc.filter(x=>x==="ok").length/sc.length*100):0;
  return {words,status,score,missed:words.filter((w,k)=>status[k]==="miss").map(w=>w.replace(/[«»"!?.,;:…]+/g,""))};
}
function pronAvg(){ const r=(S.main.pron||[]).slice(-10); return r.length?Math.round(r.reduce((a,x)=>a+x.s,0)/r.length)+" %":"—"; }

function renderOral(){

function mergeProgress(d){

  for(const [k,v] of Object.entries(dm.errors||{})) S.main.errors[k]=Math.max(S.main.errors[k]||0,+v||0);
  (dm.memory||[]).forEach(x=>{ if(x&&x.t&&!S.main.memory.some(y=>y.t===x.t)) S.main.memory.push(x); });
  const byTs=(a,b)=>{ const seen=new Set(a.map(x=>x.ts)); return a.concat((b||[]).filter(x=>x&&!seen.has(x.ts))).sort((x,y)=>x.ts-y.ts); };

async function geminiPickModel(key){

  if(!r.ok) throw new Error(r.status===400||r.status===403?"Google rejected the key: check you copied all of it.":"Google isn't responding ("+r.status+"). Try again.");
  const d=await r.json(); const names=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""));
  const ver=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]);
  const bad=/image|tts|live|audio|embed|exp|preview|thinking|vision/;
  const list=[];
  if(names.includes("gemini-flash-latest")) list.push("gemini-flash-latest");
  names.filter(n=>/^gemini-\d+(\.\d+)?-flash$/.test(n)).sort((x,y)=>ver(y)-ver(x)).forEach(n=>list.push(n));
  if(names.includes("gemini-flash-lite-latest")) list.push("gemini-flash-lite-latest");
  names.filter(n=>/^gemini-\d+(\.\d+)?-flash-lite$/.test(n)).sort((x,y)=>ver(y)-ver(x)).forEach(n=>list.push(n));
  names.filter(n=>/flash/.test(n)&&!bad.test(n)).forEach(n=>list.push(n));
  // Gemma models have a much larger free quota: keep the best two as a safety net
  const sz=n=>parseFloat((n.match(/-(\d+)b-it$/)||[0,0])[1]);
  names.filter(n=>/^gemma-[\d.]+(n)?-\d+b-it$/.test(n)).sort((x,y)=>ver(y.replace("gemma","gemini"))-ver(x.replace("gemma","gemini"))||sz(y)-sz(x)).slice(0,2).forEach(n=>list.push(n));
  const out=[...new Set(list)];
  if(!out.length) throw new Error("No Gemini Flash model is available with this key.");
  return out;
}
function parseLoose(t){

}

function bindLibrary(){

  const PC=[0,1,2,3,4,5].map(k=>etre?withPron(k,auxE[k]+" "+pp+agr[k]):withPron(k,auxA[k]+" "+pp));
  const tense=(name,arr,isSub)=>[name,arr.map((f,k)=>withPron(k,f,isSub))];
  const tenses=[tense("Présent",P),["Passé composé",PC],tense("Imparfait",IMP),tense("Futur",F),tense("Conditionnel",C),tense("Subjonctif",SUB,true)];
  return {inf:(refl&&!inf.startsWith("s'")?(VOW.test(inf)?"s'":"se ")+inf:inf),tenses,note:[note,etre&&!refl?"Uses « être » in the passé composé: the past participle agrees with the subject.":"",inf==="passer"?"« passer » takes « avoir » when it has an object (j'ai passé un exam).":""].filter(Boolean).join(" "),regular:!d};
}

 {id:"balanced",bases:["Qwen3-1.7B"],label:"Balanced · Qwen 3 (1.7B)",size:"≈ 1 GB",note:"Recommended for iPhone: natural French and quick replies."},
 {id:"light",bases:["gemma3-1b-it","Llama-3.2-1B-Instruct"],label:"Light · Gemma 3 (1B)",size:"≈ 0.7 GB",note:"Fastest and smallest, for older phones. Simpler French."},

function explainLocalErr(raw){ const m=String(raw||"");
  if(/maxStorageBufferBindingSize|maxBufferSize|Cannot initialize runtime|limit=/i.test(m)) return "Your phone's graphics memory limit is too small for this model. Choose Light.";
  if(/quota|QuotaExceeded|storage|disk/i.test(m)) return "Not enough free storage. Free up some space on your phone, or choose Light.";
  if(/fetch|network|NetworkError|load failed|aborted/i.test(m)) return "The download was interrupted. Stay on Wi-Fi with the app open (screen on) and try again.";
  if(/shader-f16|feature/i.test(m)) return "Your phone doesn't support this model's graphics features. Choose another model.";
  if(/device.*lost|out of memory|OOM|memory/i.test(m)) return "Your phone ran out of memory running this model. Choose Light, and close other apps first.";
  if(/webgpu/i.test(m)) return "WebGPU isn't available. You need iOS 26 or newer, opened from the home-screen app or Safari.";
  if(/can't run on this device/i.test(m)) return m;
  return "The offline AI couldn't be installed."; }
// hosted app ships WebLLM 0.2.84 next to index.html so it is cached for offline use; the downloaded file falls back to the CDN
const WEBLLM_URL=HOSTED?new URL("webllm.js",location.href).href:"https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.84/+esm";
const cleanThink=t=>String(t).replace(/<think>[\s\S]*?(<\/think>|$)/g,"").trim();
const Local={ L:null, engine:null, loading:null,
  supported(){ return (HOSTED||OFFLINE)&&!!navigator.gpu; },
  saved(){ return lsGet("tch_local"); },
  ready(){ const s=this.saved(); return this.supported()&&!!(s&&s.ready); },
  async lib(){ if(!this.L) this.L=await import(WEBLLM_URL); return this.L; },
  dev:null,
  async device(){ if(this.dev) return this.dev; try{ const ad=await navigator.gpu.requestAdapter(); this.dev=ad?{ok:true,f16:ad.features.has("shader-f16"),maxSB:ad.limits.maxStorageBufferBindingSize}:{ok:false}; }catch(e){ this.dev={ok:false}; } return this.dev; },
  // pick the first build of the chosen model that this GPU can actually run
  async resolve(choice){ const L=await this.lib(), d=await this.device(); if(!d.ok) throw new Error("WebGPU not available");
    const list=L.prebuiltAppConfig.model_list, small=d.maxSB<(1<<30), m=LOCAL_MODELS.find(x=>x.id===choice)||LOCAL_MODELS[0];
    for(const base of m.bases) for(const v of ["-q4f16_1-MLC","-q4f32_1-MLC"]){ const r=list.find(x=>x.model_id===base+v); if(!r) continue;
      if(v.includes("f16")&&!d.f16) continue; if((r.required_features||[]).includes("shader-f16")&&!d.f16) continue; if(small&&!r.low_resource_required) continue;
      return r.model_id; }
    throw new Error("This model can't run on this device. Choose another one."); },
  async load(onProgress){ if(this.engine) return this.engine; if(this.loading) return this.loading;
    const s=this.saved(); if(!s) throw new Error("no model installed");
    this.loading=(async()=>{ const L=await this.lib(); const e=await L.CreateMLCEngine(s.id,{initProgressCallback:p=>{ if(onProgress) try{ onProgress(p); }catch(err){} }}); this.engine=e; return e; })();
    try{ return await this.loading; } finally{ this.loading=null; } },
  async install(choice,onProgress){ const id=await this.resolve(choice), base=choice;
    lsSet("tch_local",{id,base,ready:false}); try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
    if(this.engine){ try{ await this.engine.unload(); }catch(e){} this.engine=null; }
    try{ await this.load(onProgress); }
    catch(e){ try{ const L=await this.lib(); await L.deleteModelAllInfoInCache(id); }catch(err){} lsSet("tch_local",null); throw e; }
    lsSet("tch_local",{id,base,ready:true}); },
  async remove(){ const s=this.saved(); if(!s) return; try{ if(this.engine) await this.engine.unload(); }catch(e){} this.engine=null;
    try{ const L=await this.lib(); await L.deleteModelAllInfoInCache(s.id); }catch(e){} lsSet("tch_local",null); },
  q:Promise.resolve(),
  chat(messages,opts){ const run=()=>this._chat(messages,opts); const p=this.q.then(run,run); this.q=p.catch(()=>{}); return p; },
  async _chat(messages,{onText,onProgress,maxTokens=200}={}){ const e=await this.load(onProgress); const s=this.saved();
    const req={messages,stream:true,temperature:0.8,max_tokens:maxTokens}; if(/qwen/i.test(s.id)) req.extra_body={enable_thinking:false};
    const chunks=await e.chat.completions.create(req); let text="";
    for await(const c of chunks){ const d=(c.choices&&c.choices[0]&&c.choices[0].delta&&c.choices[0].delta.content)||""; if(d){ text+=d; if(onText) onText(cleanThink(text)); } }
    return cleanThink(text); }
};
function offlineSys(){ const pp=pal(), p=S.main.profile;
  return `Tu es ${pp.name}, ${pp.age} ans, tu vis à ${pp.city} et tu es ${pp.job}. Tu es le correspondant français de ${p.name||"ton ami"}, qui apprend le français (niveau ${levelEst()}). Ce que tu sais de cette personne : ${S.main.memory.slice(-8).map(m=>m.t).join(" ; ")||"pas grand-chose encore"}.
Règles : réponds UNIQUEMENT en français naturel, comme un ami qui envoie un message : 1 à 3 phrases courtes, ${pp.tu===false?"vouvoiement":"tutoiement"}, ton chaleureux, puis une question pour continuer la conversation. Ne corrige pas ses fautes, ne traduis pas, n'écris jamais en anglais.`; }
function localTurns(){ const hist=S.chat.msgs.filter(m=>!m.pending&&m.text&&!/^\[(Jeu de rôle|Consigne)\]/.test(m.text)).slice(-8); const out=[];
  hist.forEach(m=>{ const role=m.role==="u"?"user":"assistant"; const last=out[out.length-1]; if(last&&last.role===role) last.content+="\n"+m.text; else out.push({role,content:m.text}); });
  while(out.length&&out[0].role!=="user") out.shift(); if(!out.length) out.push({role:"user",content:"Salut !"});
  out[0].content=offlineSys()+"\n\n---\n\n"+out[0].content; if(out[out.length-1].role!=="user") out.push({role:"user",content:"(continue)"}); return out; }
function warmLocal(){ if(Local.ready()&&!Local.engine&&!Local.loading&&!aiReady()) Local.load().catch(()=>{}); }
async function localReply(){
  const um=[...S.chat.msgs].reverse().find(x=>x.role==="u");
  const am={id:uid(),role:"a",text:"",ts:Date.now(),pending:true,local:true}; S.chat.msgs.push(am); chatBusy=true; renderChat(); if(callOpen()) renderCall(); setThinking(true);

  try{ const reply=await Local.chat(localTurns(),{onProgress:p=>set(`${pal().name} is waking up… ${Math.round((p.progress||0)*100)}%`),onText:t=>{ setThinking(false); set(t); }});
    am.text=reply||"…"; am.pending=false; }
  catch(e){ const i=S.chat.msgs.indexOf(am); if(i>=0) S.chat.msgs.splice(i,1); toast("The offline AI couldn't reply ("+String(e&&e.message||e).slice(0,90)+"). Try again, or install the Light model in Me.",8000); }
  chatBusy=false; setThinking(false); saveChat(); renderChat(); if(callOpen()) renderCall();
  if(am.text&&!am.pending&&(S.main.profile.autoSpeak||callOpen())) Voice.speak(am.text);

}
// a phone-sized model is not reliable enough to teach from, so its corrections stay "to be confirmed" and never become cards
async function provisionalCheck(m){
  m.provTried=true;
  try{ const out=String(await Local.chat([{role:"user",content:`Tu es professeur de français. Voici un message écrit par un apprenant anglophone :
« ${m.text} »

Liste UNIQUEMENT ses vraies fautes de français (grammaire, accords, genre, conjugaison, orthographe, accents, mauvais mot). Le français familier correct n'est PAS une faute (« t'as », « on » pour « nous », pas de « ne », « ouais »). N'invente pas de fautes.
Format : une ligne par faute, exactement comme ceci :
faute => correction | explication très courte en anglais
Si le message est correct, écris seulement : AUCUNE`}],{maxTokens:220}));
    const items=[]; const strip=x=>x.replace(/^[«"“\s]+|[»"”\s]+$/g,"");
    out.split("\n").forEach(l=>{ const mm=l.replace(/^[\s\-*•\d.)]+/,"").match(/^(.+?)\s*=>\s*(.+?)(?:\s*\|\s*(.+))?$/);
      if(mm){ const wrong=strip(mm[1]), right=strip(mm[2]); if(wrong&&right&&norm(wrong)!==norm(right)&&wrong.length<160) items.push({wrong,right,why:(mm[3]||"").trim().slice(0,160)}); } });
    if(!items.length&&!/aucune/i.test(out)) return;
    m.prov=items.slice(0,6); saveChat(); if(curView==="chat") renderChat();
  }catch(e){}
}

let lmBusy=false, lmPct=0, lmMsg="";

/* ---------------- boot ---------------- */
function renderAll(){ renderNav(); render(curView); }
async function boot(){
  const h=(location.hash||"").slice(1); if(VIEWS.some(v=>v.id===h)) curView=h;
  $$("main .view").forEach(s=>s.hidden=s.dataset.view!==curView);
  Voice.init(); renderAll();
  use("sample").then(async s=>{ if(!s&&OFFLINE){ const k=lsGet("tch_gemkey"); if(k&&k.key&&k.model){ s=geminiSample(k.key,k.model,k.alts||[]); gem=true;
      if(!k.v2) geminiPickModel(k.key).then(alts=>{ const g={key:k.key,model:alts.includes(k.model)?k.model:alts[0],alts,v2:true}; lsSet("tch_gemkey",g); sample=geminiSample(g.key,g.model,g.alts); }).catch(()=>{}); } } sample=s; aiState=s?"on":"off"; if(s){ try{ const l=await s.limits(); imgOK=!!(l&&l.images); }catch(e){} } renderAIBanner(); if(curView==="images") renderImages(); if(loaded) flushQueue(); });
  use("downloads").then(d=>{ dlOK=!!d; if(curView==="moi") renderMe(); });
  await Store.init();
  let [m,c,cards]=await Promise.all([Store.get("main"),Store.get("chat"),Store.cards()]);
  let resM=false,resC=false; const dirty=[];
  if(OFFLINE&&window.TCH_SEED){ const sd=window.TCH_SEED; if((sd.savedAt||0)>(lsGet("tch_seedAt")||0)){ m=sd.main; c=sd.chat; cards=sd.cards; lsSet("tch_main",m); lsSet("tch_chat",c); lsSet("tch_cards",cards); lsSet("tch_seedAt",sd.savedAt); } }
  if(Store.mode==="cloud"){ const mm=lsGet(Store.mk("main")), mc=lsGet(Store.mk("chat")), mk=lsGet(Store.mk("cards"));
    if(mm&&(mm.savedAt||0)>((m&&m.savedAt)||0)){ m=mm; resM=true; }
    if(mc&&(mc.savedAt||0)>((c&&c.savedAt)||0)){ c=mc; resC=true; }
    if(mk){ cards=cards||{}; for(const [id,k] of Object.entries(mk)){ if(k&&(!cards[id]||(k.last||0)>(cards[id].last||0))){ cards[id]=k; dirty.push(k); } } } }
  if(m) S.main=merge(defaultMain(),m);
  if(c) S.chat=Object.assign({msgs:[],summary:"",sumTs:0,scenario:null},c);
  S.cards=cards||{}; loaded=true;
  if(resM) saveMain(); if(resC) saveChat(); dirty.forEach(k=>Store.saveCard(k));
  flushQueue();
  if(!S.main.voiceFix1){ S.main.profile.voice=""; S.main.voiceFix1=true; saveMain(); }
  if(!S.main.profile.onboarded) openOnboarding();
  $("#v-chat").dataset.built=""; renderAll();
  if(window.tchSplashDone) window.tchSplashDone();
  setTimeout(warmLocal,2500);
}
